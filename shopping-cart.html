<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./CSS/index.css">
    <link rel="stylesheet" href="./CSS/shopping-cart.css">
    <script src="https://kit.fontawesome.com/e588cb9d47.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss"></script>
    <title>William's Shopping Cart</title>
</head>
<body>
    <!--Navigation and Header Section-->
    <header class="header">
        <div class="nametag">
           <a href="landingpage.html"><img src="assets/williams.png" alt="Williams Logo"></a>
        </div>
        <section class="leftheader">
            <div class="SContainer">
                <input type="search" placeholder="Search William's....">
            </div>
            <img src="assets/notif-bell.png" alt="Notification Bell" class="icon" style="cursor: pointer;">
            <img src="assets/shopping-cart.png" alt="Shopping Cart" class="icon" style="cursor: pointer;">
            <img id="myAvatar" src="assets/Generic-avatar.png" alt="User Icon" style="cursor: pointer;">
        </section>
    </header>
    <section class="navigation">
      <div>
          <a href="music-category.html"><h3>Music</h3></a>
            <span class="arrow" onclick="toggleDropdown(this)">&#8249;</span>
            <div class="dropdown-menu" style="display: none; position: absolute; background-color: #f9f9f9; border: 1px solid #ddd; padding: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); z-index: 100; border-radius: 5px; width: 200px; top: 12%;">
              <a href="acoustic-guitars.html" style="display: block; padding: 8px 12px; text-decoration: none; color: #333; font-size: 14px; border-radius: 3px;">Acoustic Guitars</a>
              <a href="electric-guitars.html" style="display: block; padding: 8px 12px; text-decoration: none; color: #333; font-size: 14px; border-radius: 3px;">Electric Guitars</a>
              <a href="bass-guitars.html" style="display: block; padding: 8px 12px; text-decoration: none; color: #333; font-size: 14px; border-radius: 3px;">Bass Guitars</a>
              <a href="ukuleles.html" style="display: block; padding: 8px 12px; text-decoration: none; color: #333; font-size: 14px; border-radius: 3px;">Ukuleles</a>
              <a href="amplifiers.html" style="display: block; padding: 8px 12px; text-decoration: none; color: #333; font-size: 14px; border-radius: 3px;">Amplifiers</a>
            </div>
            </div>
            <script>
            function toggleDropdown(element) {
              const dropdown = element.nextElementSibling;
              const isVisible = dropdown.style.display === 'block';
              dropdown.style.display = isVisible ? 'none' : 'block';
            }
            </script>
      </div>
      <div>
          <a href="sport-category.html"><h3>Sports</h3></a>
            <span class="arrow" onclick="toggleDropdown(this)">&#8249;</span>
            <div class="dropdown-menu" style="display: none; position: absolute; background-color: #f9f9f9; border: 1px solid #ddd; padding: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); z-index: 100; border-radius: 5px; width: 200px; top: 12%;">
              <a href="basketball.html" style="display: block; padding: 8px 12px; text-decoration: none; color: #333; font-size: 14px; border-radius: 3px;">Basketball</a>
              <a href="football.html" style="display: block; padding: 8px 12px; text-decoration: none; color: #333; font-size: 14px; border-radius: 3px;">Volleyball</a>
              <a href="tennis.html" style="display: block; padding: 8px 12px; text-decoration: none; color: #333; font-size: 14px; border-radius: 3px;">Basketball Trophies</a>
              <a href="badminton.html" style="display: block; padding: 8px 12px; text-decoration: none; color: #333; font-size: 14px; border-radius: 3px;">Volleyball Trophies</a>
            </div>
            <script>
            function toggleDropdown(element) {
              const dropdown = element.nextElementSibling;
              const isVisible = dropdown.style.display === 'block';
              dropdown.style.display = isVisible ? 'none' : 'block';
            }
            </script>
      </div>
      <a href="services-basicsetup.html"><h3>Services</h3></a>
      </div>
      <a href="landingpage.html"><h3 class="ab-landing">About us</h3></a>
    </div>
  </section>

<!--Main Section-->
<div class="container">
    <div class="progress-bar">
     <div class="step active">
      <div class="step">
        <div class="step-content">
          <div class="circle">1</div>
          <div class="label">Shopping Cart</div>
        </div>
        <div class="line" active ></div>
      </div>
     </div>
      <div class="step">
        <div class="step-content">
          <div class="circle">2</div>
          <div class="label">Checkout</div>
        </div>
        <div class="line"></div>
      </div>
      <div class="step">
        <div class="step-content">
          <div class="circle">3</div>
          <div class="label">Order Complete</div>
        </div>
        <div class="line"></div>
      </div>
    </div>
    <button class="back-button">
     <span class="arrow"><a href="landingpage.html"><i class="fa-solid fa-chevron-left"></i></span> Continue Shopping
    </button></a>
  </div>
   <div class="cart-section">
        <div class="cart-header">
          <h2>Shopping Cart <span id="cart-count">(5)</span></h2>
          <div class="header-actions">
            <label><input type="checkbox" class="custom-checkbox"> Select All</label>
            <div class="edit-icon">Edit<img src="assets/image 42.png"></img>
            </div>
          </div>
        </div>
    
        <!-- Cart Items -->
        <div class="cart-item">
          <div class="left">
            <input type="checkbox" checked class="custom-checkbox">
            <img src="assets/Yamaha FG800.png" alt="Guitar">
            <div class="item-details">
              <p class="item-name">Yamaha FG800</p>
              <p class="item-price">₱ 15,000.00</p>
            </div>
          </div>
          <div class="right">
            <div class="quantity">
              <button>-</button>
              <span>1</span>
              <button>+</button>
            </div>
            <a href="#" class="edit-link">Edit</a>
          </div>
        </div>
        <!-- Total & Checkout -->
        <div class="cart-footer">
            <div class="total">
          <p>Total <span>₱ 0.00</span> <a href="checkout.html"><button class="checkout-btn">Checkout</button></a></p>
        </div>
      </div>
   </div>

<script src="JS/shoppingcart.js"></script>
</body>
</html>
